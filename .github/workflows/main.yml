name: Build and test Group 24 app

on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn --batch-mode test

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          directory: ./target/site/jacoco
          flags: unit-tests
          verbose: true

      - name: Build application
        run: mvn --batch-mode clean package

      - name: Test application with MySQL
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start world database
        run: docker compose up -d --wait db

      - name: Integration Tests
        run: mvn --batch-mode verify

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          directory: ./target/site/jacoco
          flags: integration-tests
          verbose: true

      - name: Stop database
        if: always()
        run: docker compose down